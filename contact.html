<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header id="main-header">
    <nav class="navbar">
        <a href="index.html" class="logo">NEXUS</a>

        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="games.html">Games</a></li>
            <li><a href="news.html">News</a></li>
            <li><a class="active" href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="page-header">
        <p class="tag">GET IN TOUCH</p>
        <h1>Contact NEXUS</h1>

        <p>
            Have a game recommendation or a question?
            Send us a message.
        </p>
    </section>

    <section class="section">

        <form id="contact-form">

            <div class="form-group">
                <label for="name">Your Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required>
            </div>

            <div class="form-group">
                <label for="genre">Favorite Game Genre</label>

                <select id="genre" name="genre">
                    <option value="rpg">RPG</option>
                    <option value="action">Action</option>
                    <option value="strategy">Strategy</option>
                    <option value="racing">Racing</option>
                    <option value="sports">Sports</option>
                </select>
            </div>

            <div class="form-group">
                <label for="color">Favorite Gaming Color</label>
                <input type="color" id="color" name="color">
            </div>

            <div class="form-group">
                <label for="message">Message</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Write your message..."
                    required></textarea>
            </div>

            <button type="submit" class="btn">
                Send Message
            </button>

        </form>

    </section>

</main>

<footer>
    <p>Created by Myrzakhmetova Benazir | Group SE-2503 
        | NEXUS © 2026</p>
</footer>

</body>
</html>
